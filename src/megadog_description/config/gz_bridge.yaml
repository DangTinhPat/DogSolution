# ros_gz_bridge topic list for sim.launch.py's parameter_bridge node.
# Assumes world name "megadog_world" (worlds/megadog_world.sdf) - the
# dynamic_pose/info path below embeds it, matching babyDog's
# config/gz_bridge.yaml pattern. No entry here is scoped to the spawned
# model's own name (robot_name) - the per-foot contact-sensor bridge entries
# that used to be (model/a1/link/.../sensor/...) were removed; see
# common/foot_contacts.xacro's git history if that's ever needed again.
- ros_topic_name: "clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
- ros_topic_name: "/imu/sim_raw"
  gz_topic_name: "/imu/sim_raw"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
- ros_topic_name: "/sim/model_poses"
  gz_topic_name: "/world/megadog_world/dynamic_pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

